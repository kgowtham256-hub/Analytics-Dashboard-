<div class="kpi-row">
  <div *ngFor="let kpi of kpiData" class="kpi-card dashboard-card {{kpi.styleClass}}">
    <div class="kpi-icon">{{ kpi.icon }}</div>
    <div class="kpi-details">
      <div class="kpi-label">{{ kpi.label }}</div>
      <div class="kpi-value">{{ kpi.value | number }}</div>
    </div>
  </div>
</div>
